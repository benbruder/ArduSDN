[platformio]
default_envs = mega2_controller

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
build_flags =
  -Wall

[env:mega2_controller]
board = megaatmega2560
build_flags =
  ${env.build_flags}
  -DROLE_MEGA2_CONTROLLER
  -DNODE_ID=200

[env:mega1_relay]
board = megaatmega2560
build_flags =
  ${env.build_flags}
  -DROLE_MEGA1_RELAY
  -DNODE_ID=100

[env:nano_switch]
board = nanoatmega328
build_flags =
  ${env.build_flags}
  -DROLE_NANO_SWITCH

[env:uno_host]
board = uno
build_flags =
  ${env.build_flags}
  -DROLE_UNO_HOST